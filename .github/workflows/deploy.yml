name: Build & deploy CraveBreaker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: cravebreaker/cravebreaker-app
          path: app
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile --filter "@workspace/cravebreaker..."
      - name: Build
        working-directory: app
        env:
          PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: production
        run: pnpm --filter @workspace/cravebreaker run build
      - name: Assemble site
        run: |
          mkdir -p out
          cp -r app/artifacts/cravebreaker/dist/public/. out/
          cp out/index.html out/404.html
          cp -r site/v1 out/v1
          cp site/cravebreaker-qr.png out/
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
